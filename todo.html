<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todoリスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .wrapper {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 860px;
      align-items: flex-start;
    }

    /* ── 左：サイドバー ── */
    .sidebar {
      flex-shrink: 0;
      width: max-content;
      min-width: 150px;
      max-width: 280px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.09);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .folder-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      color: #555;
      font-size: 0.86rem;
    }
    .folder-item:hover { background: #f3f4f8; }
    .folder-item.active { background: #eef0ff; color: #4f6ef7; font-weight: 600; }
    .folder-item.archive-item.active { background: #f0faf4; color: #2da862; }

    .folder-icon { font-size: 0.9rem; flex-shrink: 0; }
    .folder-name { flex: 1; white-space: nowrap; }
    .folder-count { font-size: 0.73rem; color: #bbb; flex-shrink: 0; padding-left: 4px; }
    .folder-item.active .folder-count { color: #a0aaee; }
    .folder-item.archive-item.active .folder-count { color: #7bcca0; }

    .folder-del-btn {
      display: none;
      background: none;
      border: none;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
      color: #bbb;
    }
    .folder-item:hover .folder-del-btn,
    .folder-item:hover .folder-archive-btn { display: block; }
    .folder-del-btn:hover { color: #e55; background: #fff0f0; }
    .folder-archive-btn {
      display: none;
      background: none;
      border: none;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
      color: #bbb;
    }
    .folder-archive-btn:hover { color: #2da862; background: #f0faf4; }

    .folder-edit-input {
      flex: 1;
      border: 1.5px solid #4f6ef7;
      border-radius: 5px;
      font-size: 0.84rem;
      padding: 1px 5px;
      outline: none;
      min-width: 80px;
    }

    .sidebar-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .add-folder-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 8px;
      border-radius: 8px;
      border: none;
      background: none;
      cursor: pointer;
      color: #aaa;
      font-size: 0.83rem;
      transition: background 0.12s, color 0.12s;
      width: 100%;
      text-align: left;
      white-space: nowrap;
    }
    .add-folder-btn:hover { background: #f3f4f8; color: #4f6ef7; }

    .folder-input-box {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      background: #f7f8ff;
      border-radius: 8px;
      border: 1.5px solid #c0caff;
      margin-top: 4px;
    }
    .folder-input-box.visible { display: flex; }
    .folder-input-box input {
      border: none;
      background: transparent;
      font-size: 0.86rem;
      outline: none;
      padding: 2px 4px;
    }
    .folder-input-box .btn-row { display: flex; gap: 5px; }
    .folder-input-box button {
      flex: 1; padding: 4px; border: none; border-radius: 5px;
      font-size: 0.76rem; cursor: pointer;
    }
    .folder-input-box .ok { background: #4f6ef7; color: #fff; }

    /* ── 右：メインパネル ── */
    .main {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.09);
      padding: 24px 24px 32px;
      min-width: 0;
    }

    .main-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 { font-size: 1.4rem; color: #1a1a2e; }
    .active-folder-label { font-size: 0.85rem; color: #4f6ef7; font-weight: 600; }
    .active-folder-label.archive { color: #2da862; }

    .filters { display: flex; gap: 6px; margin-bottom: 16px; }
    .filters button {
      padding: 4px 12px;
      border: 1.5px solid #ddd;
      background: #fff;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #666;
      transition: all 0.15s;
    }
    .filters button.active { background: #1a1a2e; border-color: #1a1a2e; color: #fff; }
#sortPriorityBtn { border-color: #f90; color: #f90; margin-left: 6px; }
#sortPriorityBtn.active { background: #f90; border-color: #f90; color: #fff; }

    .input-area { margin-bottom: 14px; }
    .input-row input {
      width: 100%;
      padding: 9px 13px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #4f6ef7; }

    .input-meta { display: flex; gap: 12px; margin-top: 7px; flex-wrap: wrap; }
    .meta-field { display: flex; align-items: center; gap: 5px; }
    .meta-field.hidden { display: none; }
    .meta-field label { font-size: 0.78rem; color: #aaa; white-space: nowrap; }
    .meta-field select {
      padding: 3px 7px; border: 1.5px solid #ddd; border-radius: 6px;
      font-size: 0.8rem; outline: none; color: #444;
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      min-height: 20px;
    }
    .stats { font-size: 0.78rem; color: #aaa; }
    .clear-btn {
      font-size: 0.76rem; color: #e55; background: none; border: none;
      cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background 0.15s;
    }
    .clear-btn:hover { background: #fff0f0; }
    .clear-btn:disabled { color: #ddd; cursor: default; }
    .clear-btn:disabled:hover { background: none; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 4px 4px;
      border-bottom: 2px solid #eef0ff;
      margin-bottom: 2px;
    }
    .section-header .sec-name { font-size: 0.76rem; font-weight: 700; color: #4f6ef7; }
    .section-header .sec-count { font-size: 0.72rem; color: #bbb; }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      border-bottom: 1px solid #f2f2f2;
      transition: background 0.12s, opacity 0.15s;
      border-radius: 6px;
    }
    li:last-child { border-bottom: none; }
    li:hover { background: #fafafa; }
    li.dragging { opacity: 0.35; }
    li.drag-over { background: #eef1ff; }

    .drag-handle { color: #ccc; cursor: grab; flex-shrink: 0; user-select: none; font-size: 0.9rem; }

    .priority-dot {
      width: 9px; height: 9px; border-radius: 50%;
      flex-shrink: 0; cursor: pointer; transition: transform 0.12s;
    }
    .priority-dot:hover { transform: scale(1.4); }
    .p-high { background: #e44; }
    .p-mid  { background: #f90; }
    .p-low  { background: #4f6ef7; }
    .p-none { background: #ddd; }

    li input[type="checkbox"] {
      width: 15px; height: 15px; cursor: pointer; accent-color: #4f6ef7; flex-shrink: 0;
    }

    li .label { flex: 1; font-size: 0.93rem; color: #333; word-break: break-word; }
    li.done .label { text-decoration: line-through; color: #bbb; }

    li .edit-input {
      flex: 1; padding: 2px 6px; border: 1.5px solid #4f6ef7;
      border-radius: 5px; font-size: 0.93rem; outline: none;
    }
    li .edit-hint { font-size: 0.67rem; color: #bbb; flex-shrink: 0; white-space: nowrap; }

    .move-sel {
      display: none; padding: 2px 5px; border: 1.5px solid #ddd;
      border-radius: 5px; font-size: 0.75rem; color: #666;
      outline: none; max-width: 90px; flex-shrink: 0;
    }
    li:hover .move-sel { display: block; }

    li button.delete {
      background: none; border: none; color: #ddd; font-size: 1rem;
      cursor: pointer; padding: 2px 4px; border-radius: 4px;
      transition: color 0.15s, background 0.15s; flex-shrink: 0;
    }
    li button.delete:hover { color: #e55; background: #fff0f0; }

    .empty { text-align: center; color: #ccc; padding: 28px 0; font-size: 0.9rem; }

    /* ── アーカイブ ── */
    .archive-section-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 4px 4px;
      border-bottom: 2px solid #e8f5ee;
      margin-bottom: 2px;
    }
    .archive-section-header .sec-name { font-size: 0.76rem; font-weight: 700; color: #2da862; }
    .archive-section-header .sec-count { font-size: 0.72rem; color: #bbb; }
    .archive-section-header.folder-group { border-bottom-color: #d0e8ff; }
    .archive-section-header.folder-group .sec-name { color: #4f6ef7; }
    .archive-section-header .sec-spacer { flex: 1; }
    .folder-perm-del-btn {
      display: none;
      background: none; border: 1px solid #f5c6c6; color: #e55;
      font-size: 0.72rem; cursor: pointer; padding: 2px 8px;
      border-radius: 4px; white-space: nowrap; flex-shrink: 0;
      transition: background 0.12s;
    }
    .archive-section-header:hover .folder-perm-del-btn { display: block; }
    .folder-perm-del-btn:hover { background: #fff0f0; }

    li.archive-li {
      background: #fafafa;
      cursor: default;
    }
    li.archive-li:hover { background: #f3faf6; }
    li.archive-li .label { color: #888; text-decoration: line-through; }

    .arch-folder-badge {
      font-size: 0.7rem;
      background: #eef0ff;
      color: #7080cc;
      border-radius: 10px;
      padding: 1px 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .arch-date {
      font-size: 0.7rem;
      color: #ccc;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .restore-btn {
      background: none;
      border: 1px solid #cce8d8;
      color: #2da862;
      font-size: 0.72rem;
      cursor: pointer;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.12s;
    }
    .restore-btn:hover { background: #e8f5ee; }

    .perm-del-btn {
      background: none;
      border: none;
      color: #ddd;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }
    .perm-del-btn:hover { color: #e55; background: #fff0f0; }

    .archive-empty-msg { text-align: center; color: #2da862; opacity: 0.5; padding: 28px 0; font-size: 0.9rem; }

    /* ── スマホ対応 ── */
    @media (max-width: 600px) {
      body { padding: 0; background: #fff; }
      .wrapper { flex-direction: column; gap: 0; max-width: 100%; }
      .sidebar {
        width: 100%; max-width: 100%; border-radius: 0;
        box-shadow: none; border-bottom: 1px solid #eee;
        padding: 10px 12px; flex-direction: row; flex-wrap: wrap;
        gap: 4px; align-items: center;
      }
      .sidebar-title { display: none; }
      .folder-item { padding: 5px 8px; font-size: 0.8rem; }
      .folder-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
      .add-folder-btn { padding: 5px 8px; font-size: 0.8rem; }
      .sidebar-divider { display: none; }
      .logout-btn { padding: 5px 8px; font-size: 0.75rem; margin-top: 0; }
      .main { border-radius: 0; box-shadow: none; padding: 14px 12px 24px; }
      h1 { font-size: 1.1rem; }
      .input-row input { font-size: 0.9rem; }
      li { padding: 8px 2px; }
      li .label { font-size: 0.88rem; }
      .move-sel { display: none !important; }
      .login-box { width: 90%; padding: 40px 24px; }
    }

    /* ── ログイン画面 ── */
    #loginScreen {
      position: fixed; inset: 0;
      background: #f0f2f5;
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .login-box {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.12);
      padding: 48px 40px; text-align: center; width: 320px;
    }
    .login-box h2 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 8px; }
    .login-box p  { font-size: 0.87rem; color: #999; margin-bottom: 32px; }
    .google-login-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px 20px;
      background: #fff; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 0.93rem; color: #333; cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .google-login-btn:hover { background: #f8f8f8; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .google-login-btn img { width: 20px; height: 20px; }

    /* ── ログアウトボタン ── */
    .logout-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 8px; border-radius: 8px; border: none;
      background: none; cursor: pointer; color: #ccc;
      font-size: 0.78rem; width: 100%; text-align: left;
      transition: background 0.12s, color 0.12s; white-space: nowrap;
      margin-top: 4px;
    }
    .logout-btn:hover { background: #fff0f0; color: #e55; }
  </style>
</head>
<body>

<!-- ログイン画面 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>📋 Todoリスト</h2>
    <p>Googleアカウントでログインして<br>利用を開始してください</p>
    <button class="google-login-btn" id="loginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Googleでログイン
    </button>
  </div>
</div>

<div class="wrapper" id="mainWrapper" style="display:none">

  <!-- 左：フォルダサイドバー -->
  <div class="sidebar">
    <div class="sidebar-title">フォルダ</div>
    <div id="folderList"></div>
    <div class="sidebar-divider"></div>
    <button class="add-folder-btn" onclick="showAddFolder()">＋ 新しいフォルダ</button>
    <div class="sidebar-divider" style="margin-top:8px"></div>
    <button class="logout-btn" id="logoutBtn">↩ ログアウト</button>
    <div class="folder-input-box" id="folderInputBox">
      <input type="text" id="folderNameInput" placeholder="フォルダ名... (Shift+Enter)" maxlength="30">
      <div class="btn-row">
        <button class="ok" onclick="confirmAddFolder()">作成</button>
      </div>
    </div>
  </div>

  <!-- 右：メインパネル -->
  <div class="main">
    <div class="main-header">
      <h1>Todoリスト</h1>
      <span class="active-folder-label" id="activeFolderLabel"></span>
    </div>

    <div class="filters" id="filterBar">
      <button class="active" onclick="setFilter('all', this)">すべて</button>
      <button onclick="setFilter('active', this)">未完了</button>
      <button onclick="setFilter('done', this)">完了済み</button>
      <button id="sortPriorityBtn" onclick="toggleSortPriority()">優先度順</button>
    </div>

    <div class="input-area" id="inputArea">
      <div class="input-row" style="display:flex;gap:6px">
        <input type="text" id="todoInput" placeholder="タスクを入力..." maxlength="100" style="flex:1">
        <button onclick="addTodo()" style="padding:9px 14px;background:#4f6ef7;color:#fff;border:none;border-radius:8px;font-size:0.9rem;cursor:pointer;white-space:nowrap;flex-shrink:0">追加</button>
      </div>
      <div class="input-meta">
        <div class="meta-field" id="folderMetaField">
          <label>フォルダ：</label>
          <select id="taskFolderSelect"></select>
        </div>
        <div class="meta-field">
          <label>優先度：</label>
          <select id="taskPrioritySelect">
            <option value="none">なし</option>
            <option value="high">高</option>
            <option value="mid">中</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <span class="stats" id="stats"></span>
      <button class="clear-btn" id="clearBtn" onclick="clearDone()">完了済みをアーカイブ</button>
    </div>

    <ul id="todoList"></ul>
    <div class="empty" id="empty">タスクはありません</div>
  </div>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBUY8uoFtPPHfMaNWx4AbFMMp1anMA-U38",
    authDomain: "my-todo-4a40d.firebaseapp.com",
    projectId: "my-todo-4a40d",
    storageBucket: "my-todo-4a40d.firebasestorage.app",
    messagingSenderId: "621462849397",
    appId: "1:621462849397:web:b60314db14296f8c00f53c"
  };
  const app      = initializeApp(firebaseConfig);
  const db       = getFirestore(app);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();
  let currentDataRef = null;
  let lastSavedData  = '';
  let unsubSnap      = null;

  document.getElementById('loginBtn').onclick = () => {
    signInWithPopup(auth, provider).catch(() => {
      signInWithRedirect(auth, provider);
    });
  };
  document.getElementById('logoutBtn').onclick = () => signOut(auth);

  const UNCATEGORIZED  = '未分類';
  const PRIORITY_CLASS = { high: 'p-high', mid: 'p-mid', low: 'p-low', none: 'p-none' };
  const PRIORITY_CYCLE = ['none', 'high', 'mid', 'low'];

  let folders         = [UNCATEGORIZED];
  let todos           = [];
  let archivedTodos   = [];
  let archivedFolders = [];

  let activeFolder = 'all';
  let filter = 'all';
  let sortByPriority = false;
  let dragSrcIdx = null;

  function save() {
    if (!currentDataRef) return;
    const current = JSON.stringify([folders, todos, archivedTodos, archivedFolders]);
    if (current === lastSavedData) return;
    lastSavedData = current;
    setDoc(currentDataRef, { folders, todos, archivedTodos, archivedFolders });
  }

  /* ── 日付ソート ── */
  function extractDate(name) {
    let m;
    m = name.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);
    m = name.match(/^(\d{4})(\d{2})(\d{2})(?!\d)/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);
    m = name.match(/^(\d{1,2})[-\/](\d{1,2})(?!\d)/);
    if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
    m = name.match(/^(\d{2})(\d{2})(?!\d)/);
    if (m && +m[1]>=1 && +m[1]<=12 && +m[2]>=1 && +m[2]<=31)
      return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
    return null;
  }
  function sortFolders() {
    const withDate    = folders.filter(f => f !== UNCATEGORIZED && extractDate(f));
    const withoutDate = folders.filter(f => f !== UNCATEGORIZED && !extractDate(f));
    withDate.sort((a, b) => extractDate(a) - extractDate(b));
    folders = [UNCATEGORIZED, ...withDate, ...withoutDate];
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  }

  /* ── サイドバー描画 ── */
  function renderSidebar() {
    const list = document.getElementById('folderList');
    list.innerHTML = '';

    list.appendChild(makeFolderItem('すべて', 'all', '🗂', todos.length, false));
    folders.forEach(f => {
      const count = todos.filter(t => t.folder === f).length;
      list.appendChild(makeFolderItem(f, f, '📁', count, f !== UNCATEGORIZED));
    });

    // アーカイブ項目（区切り線の後）
    const archiveDiv = makeFolderItem('アーカイブ', 'archive', '🗄', archivedTodos.length, false);
    archiveDiv.classList.add('archive-item');

    // サイドバーに区切り線+アーカイブを追加
    const archiveDivider = document.createElement('div');
    archiveDivider.className = 'sidebar-divider';
    archiveDivider.style.marginTop = '6px';
    list.appendChild(archiveDivider);
    list.appendChild(archiveDiv);

    // フォルダ選択（すべて表示時のみ）
    const sel   = document.getElementById('taskFolderSelect');
    const field = document.getElementById('folderMetaField');
    if (activeFolder === 'all') {
      field.classList.remove('hidden');
      const prev = sel.value;
      sel.innerHTML = folders.map(f => `<option value="${f}">${f}</option>`).join('');
      if (folders.includes(prev)) sel.value = prev;
    } else {
      field.classList.add('hidden');
    }

    // ヘッダーラベル
    const lbl = document.getElementById('activeFolderLabel');
    if (activeFolder === 'all') {
      lbl.textContent = '';
      lbl.className = 'active-folder-label';
    } else if (activeFolder === 'archive') {
      lbl.textContent = '— アーカイブ';
      lbl.className = 'active-folder-label archive';
    } else {
      lbl.textContent = `— ${activeFolder}`;
      lbl.className = 'active-folder-label';
    }

    // 入力欄・フィルターをアーカイブ時は非表示
    const isArchive = activeFolder === 'archive';
    document.getElementById('inputArea').style.display  = isArchive ? 'none' : '';
    document.getElementById('filterBar').style.display  = isArchive ? 'none' : '';
    document.getElementById('clearBtn').style.display   = isArchive ? 'none' : '';
    document.getElementById('stats').style.display      = isArchive ? 'none' : '';
  }

  function makeFolderItem(label, key, icon, count, deletable) {
    const div = document.createElement('div');
    div.className = 'folder-item' + (activeFolder === key ? ' active' : '');
    div.dataset.key = key;
    div.dataset.deletable = deletable ? 'true' : 'false';

    const iconEl = document.createElement('span');
    iconEl.className = 'folder-icon';
    iconEl.textContent = icon;

    const nameEl = document.createElement('span');
    nameEl.className = 'folder-name';
    nameEl.textContent = label;

    const cntEl = document.createElement('span');
    cntEl.className = 'folder-count';
    cntEl.textContent = count;

    div.append(iconEl, nameEl, cntEl);

    if (deletable) {
      const archBtn = document.createElement('button');
      archBtn.className = 'folder-archive-btn';
      archBtn.textContent = '🗄';
      archBtn.title = 'フォルダごとアーカイブ';
      archBtn.onclick = e => { e.stopPropagation(); folderArchive(key); };
      div.appendChild(archBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'folder-del-btn';
      delBtn.textContent = '✕';
      delBtn.title = '削除';
      delBtn.onclick = e => { e.stopPropagation(); deleteFolder(key); };
      div.appendChild(delBtn);
    }
    return div;
  }

  /* ── フォルダクリック＆ダブルクリック ── */
  let _clickTimer = null;
  let _clickKey   = null;

  document.getElementById('folderList').addEventListener('click', e => {
    const item = e.target.closest('.folder-item');
    if (!item) return;
    if (e.target.closest('.folder-del-btn')) return;
    if (e.target.closest('.folder-archive-btn')) return;

    const key = item.dataset.key;

    // アーカイブはシングルクリックのみ
    if (key === 'archive') {
      clearTimeout(_clickTimer); _clickTimer = null; _clickKey = null;
      activeFolder = 'archive';
      render();
      return;
    }

    if (_clickTimer && _clickKey === key) {
      clearTimeout(_clickTimer); _clickTimer = null; _clickKey = null;
      activeFolder = key;
      render();
      if (item.dataset.deletable === 'true') {
        const fresh = [...document.querySelectorAll('.folder-item')].find(el => el.dataset.key === key);
        if (fresh) startFolderEdit(fresh);
      }
    } else {
      clearTimeout(_clickTimer);
      _clickKey   = key;
      _clickTimer = setTimeout(() => {
        _clickTimer = null; _clickKey = null;
        activeFolder = key;
        render();
      }, 250);
    }
  });

  function startFolderEdit(div) {
    if (div.querySelector('.folder-edit-input')) return;
    const key    = div.dataset.key;
    const nameEl = div.querySelector('.folder-name');
    const cntEl  = div.querySelector('.folder-count');
    const delBtn = div.querySelector('.folder-del-btn');

    div.onclick = null;
    nameEl.style.display = 'none';
    cntEl.style.display  = 'none';
    if (delBtn) delBtn.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'text'; input.className = 'folder-edit-input';
    input.value = key; input.maxLength = 30;
    div.insertBefore(input, cntEl);
    input.focus(); input.select();

    let done = false;
    const commit = () => {
      if (done) return; done = true;
      const newName = input.value.trim();
      if (newName && newName !== key) {
        if (folders.includes(newName)) { alert('同じ名前のフォルダが既にあります'); done = false; render(); return; }
        todos           = todos.map(t => t.folder === key ? { ...t, folder: newName } : t);
        archivedTodos   = archivedTodos.map(t => t.folder === key ? { ...t, folder: newName } : t);
        folders         = folders.map(f => f === key ? newName : f);
        archivedFolders = archivedFolders.map(f => f === key ? newName : f);
        sortFolders();
        if (activeFolder === key) activeFolder = newName;
      }
      render();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { done = true; render(); }
    });
    input.addEventListener('blur', () => setTimeout(commit, 80));
  }

  /* ── フォルダ追加・削除 ── */
  function showAddFolder() {
    document.getElementById('folderInputBox').classList.add('visible');
    document.getElementById('folderNameInput').focus();
  }
  function cancelAddFolder() {
    document.getElementById('folderInputBox').classList.remove('visible');
    document.getElementById('folderNameInput').value = '';
  }
  function confirmAddFolder() {
    const name = document.getElementById('folderNameInput').value.trim();
    if (!name) return;
    if (folders.includes(name)) { alert('同じ名前のフォルダが既にあります'); return; }
    folders.push(name); sortFolders(); cancelAddFolder();
    activeFolder = name; render();
  }
  function folderArchive(name) {
    const count = todos.filter(t => t.folder === name).length;
    const msg = count > 0
      ? `「${name}」のタスク ${count} 件をすべてアーカイブし、フォルダを削除します。\n（以前に個別アーカイブしたタスクも自動的にこのフォルダにまとめられます）`
      : `「${name}」をアーカイブします。\n（以前に個別アーカイブしたタスクも自動的にこのフォルダにまとめられます）`;
    if (!confirm(msg)) return;
    const today = new Date().toISOString().slice(0, 10);
    // 残っているアクティブタスクを通常アーカイブ（特別フラグなし）
    todos.filter(t => t.folder === name).forEach(t => {
      archivedTodos.unshift({ ...t, done: true, archivedAt: today });
    });
    todos   = todos.filter(t => t.folder !== name);
    folders = folders.filter(f => f !== name);
    // フォルダをアーカイブ済みリストに追加
    if (!archivedFolders.includes(name)) archivedFolders.push(name);
    sortFolders();
    if (activeFolder === name) activeFolder = 'all';
    render();
  }

  function deleteFolderFromArchive(name) {
    const count = archivedTodos.filter(t => t.folder === name).length;
    if (!confirm(`「${name}」フォルダとタスク ${count} 件を完全に削除します。\nこの操作は元に戻せません。`)) return;
    archivedTodos   = archivedTodos.filter(t => t.folder !== name);
    archivedFolders = archivedFolders.filter(f => f !== name);
    render();
  }

  function deleteFolder(name) {
    if (!confirm(`「${name}」を削除します。\nタスクは「${UNCATEGORIZED}」へ移動します。`)) return;
    todos         = todos.map(t => t.folder === name ? { ...t, folder: UNCATEGORIZED } : t);
    archivedTodos = archivedTodos.map(t => t.folder === name ? { ...t, folder: UNCATEGORIZED } : t);
    folders       = folders.filter(f => f !== name);
    sortFolders();
    if (activeFolder === name) activeFolder = 'all';
    render();
  }

  document.getElementById('folderNameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.shiftKey) confirmAddFolder();
    if (e.key === 'Escape') cancelAddFolder();
  });

  /* ── タスク描画 ── */
  const PRIORITY_ORDER = { high: 1, mid: 2, low: 3, none: 4 };

  function visibleTodos() {
    let items = todos.map((t, i) => ({ t, i }));
    if (activeFolder !== 'all') items = items.filter(({ t }) => t.folder === activeFolder);
    if (filter === 'active') items = items.filter(({ t }) => !t.done);
    if (filter === 'done')   items = items.filter(({ t }) => t.done);
    if (sortByPriority) {
      items.sort((a, b) => (PRIORITY_ORDER[a.t.priority || 'none']) - (PRIORITY_ORDER[b.t.priority || 'none']));
    } else {
      // 日付付きタスクを日付順にソート（日付なしは末尾）
      items.sort((a, b) => {
        const da = extractDate(a.t.text), db = extractDate(b.t.text);
        if (da && db) return da - db;
        if (da) return -1;
        if (db) return 1;
        return 0;
      });
    }
    return items;
  }

  function render() {
    renderSidebar();

    const list     = document.getElementById('todoList');
    const empty    = document.getElementById('empty');
    const stats    = document.getElementById('stats');
    const clearBtn = document.getElementById('clearBtn');

    list.innerHTML = '';

    if (activeFolder === 'archive') {
      renderArchive(list, empty);
      return;
    }

    const scope     = activeFolder === 'all' ? todos : todos.filter(t => t.folder === activeFolder);
    const doneCount = scope.filter(t => t.done).length;
    stats.textContent = scope.length ? `${doneCount} / ${scope.length} 完了` : '';
    clearBtn.disabled = doneCount === 0;

    const items = visibleTodos();
    if (items.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      if (activeFolder === 'all' && sortByPriority) {
        const PRIORITY_GROUPS = [
          { key: 'high', label: '🔴 高' },
          { key: 'mid',  label: '🟡 中' },
          { key: 'low',  label: '🔵 低' },
          { key: 'none', label: '⚪ なし' },
        ];
        PRIORITY_GROUPS.forEach(({ key, label }) => {
          const groupItems = items.filter(({ t }) => (t.priority || 'none') === key);
          if (groupItems.length === 0) return;
          const header = document.createElement('div');
          header.className = 'section-header';
          header.innerHTML = `<span class="sec-name">${label}</span><span class="sec-count">${groupItems.length}件</span>`;
          list.appendChild(header);
          groupItems.forEach(({ t, i }) => renderItem(list, t, i));
        });
      } else if (activeFolder === 'all') {
        const grouped = {};
        folders.forEach(f => { grouped[f] = []; });
        items.forEach(item => {
          const f = item.t.folder || UNCATEGORIZED;
          if (!grouped[f]) grouped[f] = [];
          grouped[f].push(item);
        });
        folders.forEach(f => {
          if (!grouped[f] || grouped[f].length === 0) return;
          const header = document.createElement('div');
          header.className = 'section-header';
          header.innerHTML = `<span class="sec-name">📁 ${f}</span><span class="sec-count">${grouped[f].length}件</span>`;
          list.appendChild(header);
          grouped[f].forEach(({ t, i }) => renderItem(list, t, i));
        });
      } else {
        items.forEach(({ t, i }) => renderItem(list, t, i));
      }
    }

    save();
  }

  /* ── アーカイブ描画 ── */
  function renderArchive(list, empty) {
    if (archivedTodos.length === 0 && archivedFolders.length === 0) {
      empty.style.display = 'block';
      empty.className = 'archive-empty-msg';
      empty.textContent = 'アーカイブはありません';
      save();
      return;
    }
    empty.style.display = 'none';
    empty.className = 'empty';
    empty.textContent = 'タスクはありません';

    // archivedFolders に入っているフォルダ名 → フォルダグループ
    // それ以外 → 日付グループ
    if (archivedFolders.length > 0) {
      // フォルダごとの最新アーカイブ日を求めてソート
      const folderDateMap = {};
      archivedFolders.forEach(f => { folderDateMap[f] = ''; });
      archivedTodos.forEach(t => {
        if (archivedFolders.includes(t.folder) && (t.archivedAt || '') > folderDateMap[t.folder]) {
          folderDateMap[t.folder] = t.archivedAt || '';
        }
      });
      const sortedFolders = [...archivedFolders].sort((a, b) =>
        folderDateMap[b].localeCompare(folderDateMap[a])
      );
      sortedFolders.forEach(fname => {
        const items = archivedTodos.map((t, i) => ({ t, i })).filter(({ t }) => t.folder === fname);
        const header = document.createElement('div');
        header.className = 'archive-section-header folder-group';

        const nameEl = document.createElement('span');
        nameEl.className = 'sec-name';
        nameEl.textContent = `📁 ${fname}`;

        const cntEl = document.createElement('span');
        cntEl.className = 'sec-count';
        cntEl.textContent = `${items.length}件`;

        const spacer = document.createElement('span');
        spacer.className = 'sec-spacer';

        const delBtn = document.createElement('button');
        delBtn.className = 'folder-perm-del-btn';
        delBtn.textContent = '完全削除';
        delBtn.title = 'このフォルダとすべてのタスクを完全に削除';
        delBtn.onclick = () => deleteFolderFromArchive(fname);

        header.append(nameEl, cntEl, spacer, delBtn);
        list.appendChild(header);
        items.forEach(({ t, i }) => renderArchiveItem(list, t, i, true));
      });
    }

    // 日付グループ（アーカイブ済みフォルダに属さないタスク、新しい順）
    const individualItems = archivedTodos.map((t, i) => ({ t, i }))
      .filter(({ t }) => !archivedFolders.includes(t.folder));
    if (individualItems.length > 0) {
      const dateGrouped = {};
      individualItems.forEach(({ t, i }) => {
        const d = t.archivedAt || '不明';
        if (!dateGrouped[d]) dateGrouped[d] = [];
        dateGrouped[d].push({ t, i });
      });
      const sortedDates = Object.keys(dateGrouped).sort((a, b) => b.localeCompare(a));
      sortedDates.forEach(date => {
        const header = document.createElement('div');
        header.className = 'archive-section-header';
        header.innerHTML = `<span class="sec-name">🗄 ${formatDate(date)}</span><span class="sec-count">${dateGrouped[date].length}件</span>`;
        list.appendChild(header);
        dateGrouped[date].forEach(({ t, i }) => renderArchiveItem(list, t, i, false));
      });
    }

    save();
  }

  function renderArchiveItem(list, todo, archIdx, isFolderGroup) {
    const li = document.createElement('li');
    li.classList.add('archive-li');

    const dot = document.createElement('span');
    dot.className = `priority-dot ${PRIORITY_CLASS[todo.priority || 'none']}`;
    dot.style.cursor = 'default';

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = todo.text;

    const dateEl = document.createElement('span');
    dateEl.className = 'arch-date';
    dateEl.textContent = formatDate(todo.archivedAt || new Date().toISOString().slice(0,10));

    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'restore-btn';
    restoreBtn.textContent = '復元';
    restoreBtn.title = '元のフォルダに戻す';
    restoreBtn.onclick = () => restoreFromArchive(archIdx);

    const permDel = document.createElement('button');
    permDel.className = 'perm-del-btn';
    permDel.textContent = '×';
    permDel.title = '完全に削除';
    permDel.onclick = () => { archivedTodos.splice(archIdx, 1); render(); };

    if (isFolderGroup) {
      // フォルダグループ内はフォルダバッジ不要、日付のみ
      li.append(dot, label, dateEl, restoreBtn, permDel);
    } else {
      const badge = document.createElement('span');
      badge.className = 'arch-folder-badge';
      badge.textContent = todo.folder;
      li.append(dot, label, badge, dateEl, restoreBtn, permDel);
    }
    list.appendChild(li);
  }

  function restoreFromArchive(archIdx) {
    const t = archivedTodos[archIdx];
    // フォルダが削除されていたら未分類へ
    const targetFolder = folders.includes(t.folder) ? t.folder : UNCATEGORIZED;
    todos.push({ text: t.text, done: false, folder: targetFolder, priority: t.priority || 'none' });
    archivedTodos.splice(archIdx, 1);
    activeFolder = targetFolder;
    render();
  }

  function renderItem(list, todo, realIdx) {
    const li = document.createElement('li');
    if (todo.done) li.classList.add('done');
    li.draggable = true;

    const handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.textContent = '⠿';

    const dot = document.createElement('span');
    dot.className = `priority-dot ${PRIORITY_CLASS[todo.priority || 'none']}`;
    dot.title = '優先度をクリックで変更';
    dot.onclick = () => {
      const cur  = todos[realIdx].priority || 'none';
      const next = PRIORITY_CYCLE[(PRIORITY_CYCLE.indexOf(cur) + 1) % PRIORITY_CYCLE.length];
      todos[realIdx].priority = next;
      render();
    };

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = todo.done;
    cb.onchange = () => { todos[realIdx].done = !todos[realIdx].done; render(); };

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = todo.text;
    label.title = 'ダブルクリックで編集';
    label.ondblclick = () => startEdit(li, realIdx, label, hint, del);

    const hint = document.createElement('span');
    hint.className = 'edit-hint';
    hint.style.display = 'none';
    hint.textContent = 'Enter保存 / Esc取消';

    const moveSel = document.createElement('select');
    moveSel.className = 'move-sel';
    moveSel.title = 'フォルダを移動';
    folders.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f; opt.textContent = f;
      if (f === todo.folder) opt.selected = true;
      moveSel.appendChild(opt);
    });
    moveSel.onchange = () => { todos[realIdx].folder = moveSel.value; render(); };
    moveSel.onclick  = e => e.stopPropagation();

    const del = document.createElement('button');
    del.className = 'delete'; del.textContent = '×'; del.title = '削除';
    del.onclick = () => { todos.splice(realIdx, 1); render(); };

    li.append(handle, dot, cb, label, hint, moveSel, del);

    li.addEventListener('dragstart', () => { dragSrcIdx = realIdx; setTimeout(() => li.classList.add('dragging'), 0); });
    li.addEventListener('dragend',   () => li.classList.remove('dragging'));
    li.addEventListener('dragover',  e => { e.preventDefault(); li.classList.add('drag-over'); });
    li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
    li.addEventListener('drop', e => {
      e.preventDefault(); li.classList.remove('drag-over');
      if (dragSrcIdx !== null && dragSrcIdx !== realIdx) {
        const moved = todos.splice(dragSrcIdx, 1)[0];
        todos.splice(dragSrcIdx < realIdx ? realIdx - 1 : realIdx, 0, moved);
        dragSrcIdx = null; render();
      }
    });

    list.appendChild(li);
  }

  function startEdit(li, idx, label, hint, del) {
    if (todos[idx].done) return;
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'edit-input';
    input.value = todos[idx].text; input.maxLength = 100;
    label.style.display = 'none'; hint.style.display = ''; del.style.display = 'none';
    li.insertBefore(input, hint); input.focus(); input.select();
    const commit = () => { const v = input.value.trim(); if (v) todos[idx].text = v; render(); };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') render();
    });
    input.addEventListener('blur', commit);
  }

  /* ── タスク追加 ── */
  function addTodo() {
    const input = document.getElementById('todoInput');
    const text  = input.value.trim();
    if (!text) return;
    const folder   = activeFolder === 'all' || activeFolder === 'archive'
      ? (document.getElementById('taskFolderSelect').value || UNCATEGORIZED)
      : activeFolder;
    const priority = document.getElementById('taskPrioritySelect').value;
    todos.push({ text, done: false, folder, priority });
    input.value = '';
    if (filter === 'done') {
      filter = 'all';
      document.querySelectorAll('.filters button').forEach((b, i) => b.classList.toggle('active', i === 0));
    }
    render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filters button:not(#sortPriorityBtn)').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    render();
  }

  function toggleSortPriority() {
    sortByPriority = !sortByPriority;
    document.getElementById('sortPriorityBtn').classList.toggle('active', sortByPriority);
    render();
  }

  /* ── 完了済みをアーカイブ ── */
  function clearDone() {
    const today = new Date().toISOString().slice(0, 10);
    const scope = activeFolder === 'all' ? null : activeFolder;
    const toArchive = todos.filter(t => scope ? (t.folder === scope && t.done) : t.done);
    toArchive.forEach(t => archivedTodos.unshift({ ...t, archivedAt: today }));
    todos = todos.filter(t => scope ? (t.folder !== scope || !t.done) : !t.done);
    render();
  }

  // type="module"ではonclick=""からグローバル関数を呼べないため、windowに登録
  window.showAddFolder      = showAddFolder;
  window.cancelAddFolder    = cancelAddFolder;
  window.confirmAddFolder   = confirmAddFolder;
  window.setFilter          = setFilter;
  window.clearDone          = clearDone;
  window.addTodo            = addTodo;
  window.toggleSortPriority = toggleSortPriority;

  document.getElementById('todoInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTodo(); }
  });
  document.getElementById('taskFolderSelect').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTodo(); }
  });
  document.getElementById('taskPrioritySelect').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTodo(); }
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    if (e.target.matches('input, textarea, select, button, a')) return;
    e.preventDefault();
    const folderBox = document.getElementById('folderInputBox');
    if (folderBox.classList.contains('visible')) {
      document.getElementById('folderNameInput').focus();
    } else {
      document.getElementById('todoInput').focus();
    }
  }, true);

  // ログイン状態を監視
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // ログイン済み → アプリ表示
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainWrapper').style.display = '';
      currentDataRef = doc(db, 'users', user.uid);
      lastSavedData  = '';
      folders = [UNCATEGORIZED]; todos = []; archivedTodos = []; archivedFolders = [];

      if (unsubSnap) unsubSnap();
      unsubSnap = onSnapshot(currentDataRef, { includeMetadataChanges: true }, (snap) => {
        if (snap.metadata.hasPendingWrites) return;
        if (snap.exists()) {
          const data = snap.data();
          folders         = data.folders         || [UNCATEGORIZED];
          todos           = (data.todos          || []).map(t => ({
            text: t.text, done: t.done || false,
            folder: t.folder || UNCATEGORIZED, priority: t.priority || 'none',
          }));
          archivedTodos   = data.archivedTodos   || [];
          archivedFolders = data.archivedFolders || [];
          archivedTodos.forEach(t => {
            if (t.archivedAsFolder && t.folder && !archivedFolders.includes(t.folder)) {
              archivedFolders.push(t.folder);
            }
          });
          lastSavedData = JSON.stringify([folders, todos, archivedTodos, archivedFolders]);
        }
        sortFolders();
        render();
      });
    } else {
      // 未ログイン → ログイン画面表示
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('mainWrapper').style.display = 'none';
      currentDataRef = null;
      if (unsubSnap) { unsubSnap(); unsubSnap = null; }
    }
  });
</script>
</body>
</html>
